[package]
name = "stopc"
version = "0.1.0"
description = "Copy Once. Trust Forever. — a clipboard confidence app."
authors = ["StopC Contributors"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2.1"
tauri-plugin-notification = "2.1"
tauri-plugin-autostart = "2.1"
tauri-plugin-store = "2.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Clipboard read access across Win/macOS/Linux (X11 + Wayland-partial).
arboard = "3.4"
# Content hashing to detect real changes vs. re-copy of identical data.
sha2 = "0.10"
# Global keyboard hook for Funny Mode's repeated-Ctrl+C detection.
# NOTE: requires Accessibility permission on macOS and may require
# elevated/uiAccess privileges in some Windows security contexts.
rdev = "0.5"

once_cell = "1.20"
chrono = "0.4"
rand = "0.8"

[features]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "stopc"
path = "src/main.rs"
